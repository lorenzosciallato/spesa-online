<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f2" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Spesa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!-- SCHERMATA 1: la lista -->
    <section id="schermo-lista" class="schermo">
      <header class="testata">
        <h1>Spesa</h1>
        <a id="sessione" class="sessione" href="/conad.html" hidden></a>
      </header>

      <main class="contenuto">
        <p id="vuoto" class="vuoto">
          Tocca il microfono e di' un prodotto alla volta.<br />
          Dopo tre secondi di silenzio, finisce nella lista.
        </p>
        <ul id="lista" class="lista" aria-live="polite"></ul>

        <form id="scrivi" class="scrivi" autocomplete="off">
          <input id="campo" type="text" placeholder="…oppure scrivilo qui" aria-label="Aggiungi un prodotto scrivendolo" enterkeyhint="done" />
          <button type="submit" aria-label="Aggiungi alla lista">+</button>
        </form>
      </main>

      <footer class="comandi">
        <p id="ascolto" class="ascolto" role="status" aria-live="polite"></p>
        <div class="barra-comandi">
          <button id="svuota" class="tondo secondario" type="button" aria-label="Svuota la lista" title="Svuota la lista">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12M9 7V5h6v2M8 7l1 12h6l1-12" /></svg>
          </button>

          <button id="microfono" class="microfono" type="button" aria-label="Detta la lista" aria-pressed="false">
            <svg class="anello" viewBox="0 0 100 100" aria-hidden="true">
              <circle class="traccia" cx="50" cy="50" r="46" />
              <circle id="progresso" class="progresso" cx="50" cy="50" r="46" />
            </svg>
            <svg class="icona-mic" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M9 21h6" />
            </svg>
            <span id="ultima" class="ultima" aria-hidden="true"></span>
          </button>

          <button id="vai" class="tondo vai" type="button" disabled>Vai</button>
        </div>
      </footer>
    </section>

    <!-- SCHERMATA 2: il lavoro in corso e il risultato -->
    <section id="schermo-esito" class="schermo" hidden>
      <header class="testata">
        <h1 id="titolo-esito">Preparo la spesa</h1>
      </header>

      <main class="contenuto">
        <ol id="passi" class="passi">
          <li id="passo-cerca">Cerco i prodotti più convenienti</li>
          <li id="passo-carrello">Li metto nel carrello Conad</li>
        </ol>

        <div id="esito" class="esito" hidden>
          <ul id="messi" class="messi"></ul>
          <p id="totale" class="totale" hidden></p>
          <div id="saltati" class="saltati" hidden>
            <h2>Non trovati</h2>
            <ul></ul>
          </div>
          <p id="errore" class="errore" hidden></p>
        </div>
      </main>

      <footer class="comandi esito-comandi">
        <a id="paga" class="pieno" href="https://spesaonline.conad.it/" target="_blank" rel="noopener" hidden>Vai a pagare su Conad</a>
        <button id="nuova" class="pieno secondario" type="button" hidden>Nuova spesa</button>
      </footer>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
